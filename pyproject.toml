[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-b"
version = "0.1.0"
description = "Point-in-time A-share limit-up strategy research framework"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "PyYAML>=6.0",
  "tushare>=1.4.20"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
logic-b = "logic_b.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
