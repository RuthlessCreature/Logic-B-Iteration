name: logic-b-core
on:
  push:
    branches: [research/behavioral-edge-20261013]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m logic_b --dataset examples/toy_history.json --out runs/smoke
      - run: python -m logic_b.runtime_cli --snapshot examples/runtime_shadow_snapshot.json --out runs/runtime-shadow/decision.json
