name: h01-history-backfill-2020
on:
  push:
    paths: [".github/workflows/h01-history-backfill-2020.yml"]
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {key: "2020h1", start: "2020-01-01", end: "2020-06-30"}
          - {key: "2020h2", start: "2020-07-01", end: "2020-12-31"}
          - {key: "2021h1", start: "2021-01-01", end: "2021-06-30"}
          - {key: "2021h2", start: "2021-07-01", end: "2021-12-31"}
          - {key: "2022h1", start: "2022-01-01", end: "2022-06-30"}
          - {key: "2022h2", start: "2022-07-01", end: "2022-12-31"}
          - {key: "2023h1", start: "2023-01-01", end: "2023-06-30"}
          - {key: "2023h2", start: "2023-07-01", end: "2023-12-31"}
          - {key: "2024h1", start: "2024-01-01", end: "2024-06-30"}
          - {key: "2024h2", start: "2024-07-01", end: "2024-12-31"}
          - {key: "2025h1", start: "2025-01-01", end: "2025-06-30"}
          - {key: "2025h2", start: "2025-07-01", end: "2025-12-31"}
          - {key: "2026dev", start: "2026-01-01", end: "2026-06-30"}
          - {key: "2026observed", start: "2026-07-01", end: "2026-10-12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Collect point-in-time historical event lists
        run: |
          set -euo pipefail
          logic-b fetch-xgb-evidence \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --data-root /tmp/h01-history \
            --sleep 0.08
      - name: Write source metadata
        if: always()
        run: |
          mkdir -p /tmp/h01-history/batch_metadata
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/h01-history/batch_metadata")
          data={"part":"${{ matrix.key }}","start":"${{ matrix.start }}",
                "end":"${{ matrix.end }}",
                "data_purpose":"historical behavior research only",
                "protected_blind_period":"2026-07-01..2026-09-28",
                "data_is_not_net_equity_performance":True}
          (p/"${{ matrix.key }}.json").write_text(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h01-raw-${{ matrix.key }}
          path: /tmp/h01-history
          retention-days: 30
          if-no-files-found: warn
  audit-and-explore:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" exchange-calendars==4.13.1
      - uses: actions/download-artifact@v4
        with:
          pattern: h01-raw-*
          path: /tmp/h01-history
          merge-multiple: true
      - name: Independent trade-calendar coverage check
        run: |
          mkdir -p /tmp/h01-study
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import exchange_calendars as xc
          from logic_b.storage import LocalParquetStore
          s=LocalParquetStore("/tmp/h01-history")
          cal=s.read_all_parts("calendar")
          col="cal_date" if "cal_date" in cal else "trade_date"
          actual=set(pd.to_datetime(cal[col]).dt.strftime("%Y%m%d")) if not cal.empty else set()
          expected=xc.get_calendar("XSHG").sessions_in_range("2020-01-01","2026-10-12").strftime("%Y%m%d").tolist()
          missing=sorted(set(expected)-actual)
          extra=sorted(actual-set(expected))
          cutoff="20260630"
          report={"requested_start":"2020-01-01","requested_end":"2026-10-12",
                  "expected_sessions":len(expected),
                  "retrieved_sessions":len(actual),
                  "missing_sessions":missing,"extra_sessions":extra,
                  "development_missing":[x for x in missing if x<=cutoff],
                  "historical_blind_20260701_20260928_isolated":True,
                  "reference":"exchange_calendars XSHG (secondary, not official source)"}
          Path("/tmp/h01-study/calendar_audit.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report["development_missing"] or extra:
              raise SystemExit("BLOCKED_INCOMPLETE_TRADE_CALENDAR")
          PY
      - name: H01 long-horizon exploratory forecast
        run: |
          set -euo pipefail
          python -m logic_b.h01_cli \
            --data-root /tmp/h01-history \
            --start 2020-01-01 --end 2026-06-30 \
            --vendor-market-experience \
            --min-train 120 --min-test 40 \
            --out /tmp/h01-study/forecast
      - name: Count consistency audit (do not hide discrepancies)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from logic_b.storage import LocalParquetStore
          from logic_b.h01_data_audit import audit_xgb_limit_up_counts
          root=Path("/tmp/h01-study")
          s=LocalParquetStore("/tmp/h01-history")
          cal=s.read_all_parts("calendar")
          if cal.empty: raise SystemExit("no source calendar")
          values=pd.to_datetime(cal.cal_date).dt.strftime("%Y%m%d")
          dates=sorted(set(v for v in values if "20200101"<=v<="20260630"))
          out,t=audit_xgb_limit_up_counts(s,dates)
          (root/"source_count_audit.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          t.to_csv(root/"source_count_days.csv",index=False)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h01-2020-2026-research-reports
          path: /tmp/h01-study
          retention-days: 30
          if-no-files-found: warn
