name: h02-historical-official-limits-permission-probe
on:
  push:
    paths: [".github/workflows/h02-historical-official-limits-permission-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-limit-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Probe official historical limit-price / ST / suspension provider permissions
        run: |
          mkdir -p /tmp/h02-official-preflight
          python - <<'PY'
          import os,json
          from pathlib import Path
          from datetime import date
          from logic_b.providers.tushare import TushareProvider

          result={
             "trade_date":"2020-01-03",
             "sample_codes":["000998.SZ","000716.SZ","600421.SH"],
             "credentials_disclosed":False,
             "features":{},
             "status":"BLOCKED",
             "net_equity_ready":False,
          }
          if not os.getenv("TUSHARE_TOKEN"):
              result["status"]="BLOCKED_MISSING_TUSHARE_TOKEN"
          else:
              p=TushareProvider(max_attempts=2,retry_base_seconds=0.5)
              for name,fn in [
                  ("stk_limit",p.limit_prices),
                  ("stock_st",p.st_status),
                  ("suspend_d",p.suspensions),
              ]:
                  try:
                      frame=fn(date(2020,1,3))
                      if frame is None:
                          raise ValueError("provider returned None")
                      if name=="stk_limit":
                          if not {"ts_code","up_limit","down_limit"}.issubset(frame):
                              raise ValueError("missing official price-limit fields")
                          sample=frame.loc[frame.ts_code.isin(result["sample_codes"]),
                                           ["ts_code","up_limit","down_limit"]]
                          rows=sample.to_dict(orient="records")
                      else:
                          rows=[]
                      result["features"][name]={
                          "status":"READABLE" if len(frame) or name=="suspend_d" else "REVIEW_EMPTY",
                          "rows":len(frame),
                          "sample_limit_rows":rows,
                      }
                  except Exception as exc:
                      result["features"][name]={
                          "status":"BLOCKED_PERMISSION_OR_PROVIDER_ERROR",
                          "error_type":type(exc).__name__,
                          "message":str(exc)[:180],
                      }
              result["status"]=(
                  "HISTORICAL_FIELDS_READABLE"
                  if all(result["features"].get(k,{}).get("status") in ("READABLE","REVIEW_EMPTY")
                         for k in ("stk_limit","stock_st","suspend_d"))
                  else "BLOCKED_REQUIRED_FIELDS"
              )
          path=Path("/tmp/h02-official-preflight/report.json")
          path.write_text(json.dumps(result,ensure_ascii=False,indent=2,allow_nan=False))
          print(json.dumps(result,ensure_ascii=False,indent=2,allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h02-2020-official-limits-permission-report
          path: /tmp/h02-official-preflight
          if-no-files-found: warn
          retention-days: 14
