name: V05 historical minute model preflight
on:
  push:
    paths:
      - 'src/logic_b/v05_research.py'
      - 'tests/test_v05_research.py'
      - '.github/workflows/v05-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_v05_research.py
      - name: Real dated Xuangubao data pilot - never touch blind holdout
        run: python -m logic_b.v05_research --start 2025-01-06 --end 2025-01-15 --per-day 2 --out runs/v05-pilot
      - name: Save only aggregate readiness and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v05-research-aggregate
          path: |
            runs/v05-pilot/quality.json
            runs/v05-pilot/training.json
          if-no-files-found: warn
          retention-days: 14
