name: h02-forward-market-pilot
on:
  push:
    branches:
      - research/behavioral-edge-20261013
    paths:
      - .github/workflows/h02-forward-market-pilot.yml
      - scripts/h02_forward_market_condition_pilot.py
      - scripts/h02_stock_event_conditional_pilot.py
      - scripts/h02_final_stock_features.py
      - scripts/h02_final_stock_forecast.py
      - tests/test_h02_stock_event_conditional_pilot.py
      - tests/test_h02_forward_market_condition_pilot.py
      - tests/test_h02_final_stock_features.py
      - tests/test_h02_final_stock_forecast.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/h02-forward-market-pilot.yml
      - scripts/h02_forward_market_condition_pilot.py
      - scripts/h02_final_stock_features.py
      - scripts/h02_final_stock_forecast.py
      - tests/test_h02_forward_market_condition_pilot.py
      - tests/test_h02_final_stock_features.py
      - tests/test_h02_final_stock_forecast.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  market-forward-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run forward pilot regressions
        run: python -m pytest -q tests/test_h02_forward_market_condition_pilot.py tests/test_h02_stock_event_conditional_pilot.py tests/test_h02_final_stock_features.py
      - name: Inspect retained source report and artifact contract (metadata only)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("research/experiments/h02-stage0-20261013/H02_FIRST_EMPIRICAL_RESULT_20261014.json")
          print("RETAINED_REPORT size=", p.stat().st_size, "prefix=", repr(p.read_bytes()[:100]))
          PY
      - name: Fetch exactly five SHA-pinned GitHub artifact ZIPs (never observed holdout)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h02-archives"
          for part in 2024h1 2024h2 2025h1 2025h2 2026dev; do
            case "$part" in
              2024h1) id=11797278322 ;;
              2024h2) id=11797792805 ;;
              2025h1) id=11797588455 ;;
              2025h2) id=11798034955 ;;
              2026dev) id=11798524194 ;;
              *) exit 3 ;;
            esac
            file="$RUNNER_TEMP/h02-archives/h01-raw-$part.zip"
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              --output "$file"
            sha256sum "$file"
          done
      - name: Reconstruct historical event result from SHA-pinned source archives
        run: |
          set -euo pipefail
          mkdir -p runs/h02-forward-market-pilot
          python scripts/h02_first_empirical_result.py \
            --artifacts \
              "$RUNNER_TEMP/h02-archives/h01-raw-2024h1.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2024h2.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2025h1.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2025h2.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2026dev.zip" \
            --json runs/h02-forward-market-pilot/source-reconstructed.json \
            --markdown runs/h02-forward-market-pilot/source-reconstructed.md
      - name: Run frozen three-outcome pilot
        run: |
          python scripts/h02_forward_market_condition_pilot.py \
            --source runs/h02-forward-market-pilot/source-reconstructed.json \
            --out runs/h02-forward-market-pilot/report.json
      - name: Run stock-level event-streak conditional pilot (Tier D only)
        run: |
          python scripts/h02_stock_event_conditional_pilot.py \
            --artifacts \
              "$RUNNER_TEMP/h02-archives/h01-raw-2024h1.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2024h2.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2025h1.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2025h2.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2026dev.zip" \
            --out runs/h02-forward-market-pilot/stock-event-report.json
      - name: Run expanded stock feature and conditional research (aggregate reports only)
        run: |
          python scripts/h02_final_stock_features.py \
            --artifacts \
              "$RUNNER_TEMP/h02-archives/h01-raw-2024h1.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2024h2.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2025h1.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2025h2.zip" \
              "$RUNNER_TEMP/h02-archives/h01-raw-2026dev.zip" \
            --out-json runs/h02-forward-market-pilot/final-stock-features.json \
            --out-markdown runs/h02-forward-market-pilot/final-stock-features.md \
            --matrix-out "$RUNNER_TEMP/h02-final-stock-feature-matrix.csv"
      - name: Fit stock event forecast models and risk-prioritized research rankings
        run: |
          python scripts/h02_final_stock_forecast.py \
            --matrix "$RUNNER_TEMP/h02-final-stock-feature-matrix.csv" \
            --out-json runs/h02-forward-market-pilot/final-stock-forecast.json \
            --out-markdown runs/h02-forward-market-pilot/final-stock-forecast.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h02-forward-market-pilot
          path: runs/h02-forward-market-pilot/
          if-no-files-found: warn
          retention-days: 14
