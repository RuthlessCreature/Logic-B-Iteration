name: h02-forward-market-pilot
on:
  push:
    branches:
      - research/behavioral-edge-20261013
    paths:
      - .github/workflows/h02-forward-market-pilot.yml
      - scripts/h02_forward_market_condition_pilot.py
      - tests/test_h02_forward_market_condition_pilot.py
      - research/experiments/h02-stage0-20261013/H02_FIRST_EMPIRICAL_RESULT_20261014.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/h02-forward-market-pilot.yml
      - scripts/h02_forward_market_condition_pilot.py
      - tests/test_h02_forward_market_condition_pilot.py
      - research/experiments/h02-stage0-20261013/H02_FIRST_EMPIRICAL_RESULT_20261014.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-forward-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run forward pilot regressions
        run: python -m pytest -q tests/test_h02_forward_market_condition_pilot.py
      - name: Run frozen three-outcome pilot
        run: python scripts/h02_forward_market_condition_pilot.py --out runs/h02-forward-market-pilot/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h02-forward-market-pilot
          path: runs/h02-forward-market-pilot/report.json
          if-no-files-found: warn
          retention-days: 14
