name: xgb-research-request

on:
  push:
    paths:
      - "research/run_requests/**"
  workflow_dispatch:

jobs:
  xgb-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_ROOT: /tmp/logic-b-xgb
      RUN_ROOT: /tmp/logic-b-runs
      PILOT_START: "2024-12-27"
      PILOT_END: "2025-01-27"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: pytest

      - name: Public endpoint preflight
        id: preflight
        continue-on-error: true
        run: |
          logic-b preflight-xgb --date 2025-01-27
          logic-b preflight-xgb-market --date 2025-01-27

      - name: Fetch evidence
        id: evidence
        if: steps.tests.outcome == 'success' && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          time logic-b fetch-xgb-evidence \
            --start "$PILOT_START" \
            --end "$PILOT_END" \
            --data-root "$DATA_ROOT" \
            --sleep 0.05 | tee /tmp/fetch-evidence.log

      - name: Fetch candidate market slices
        id: market
        if: steps.evidence.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          time logic-b fetch-xgb-market \
            --start "$PILOT_START" \
            --end "$PILOT_END" \
            --data-root "$DATA_ROOT" \
            --sleep 0.05 | tee /tmp/fetch-market.log

      - name: Candidate readiness
        id: readiness
        if: steps.market.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          logic-b xgb-readiness \
            --start "$PILOT_START" \
            --end "$PILOT_END" \
            --data-root "$DATA_ROOT" | tee /tmp/readiness.json

      - name: B0 three-fill replay
        id: replay
        if: steps.readiness.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          logic-b run-b0 \
            --start "$PILOT_START" \
            --end "$PILOT_END" \
            --data-root "$DATA_ROOT" \
            --run-root "$RUN_ROOT" \
            --fill all \
            --fetch-missing-minutes \
            --missing-minute-source xuangubao | tee /tmp/b0-run.json

      - name: Emit research summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          root=Path(os.environ["RUN_ROOT"])
          summary=["# XGB pilot research run", ""]
          summary.append(f"- window: {os.environ['PILOT_START']} .. {os.environ['PILOT_END']}")
          summary.append("")

          for path in sorted(root.glob("*/metrics.json")):
              data=json.loads(path.read_text(encoding="utf-8"))
              summary.append(f"## {path.parent.name}")
              for key in [
                  "total_return","cagr","max_drawdown","calmar",
                  "closed_trades","win_rate","expectancy",
                  "profit_factor","signals","ending_position",
              ]:
                  if key in data:
                      summary.append(f"- {key}: {data[key]}")
              summary.append("")

          text="\n".join(summary)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fh:
              fh.write(text+"\n")
          PY

      - name: Upload pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgb-pilot-2024-12-27_2025-01-27
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/logic-b-runs/
            /tmp/readiness.json
            /tmp/b0-run.json
            /tmp/fetch-evidence.log
            /tmp/fetch-market.log

      - name: Classify pilot result
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
          MARKET: ${{ steps.market.outcome }}
          READINESS: ${{ steps.readiness.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          stages={
              "tests":os.environ.get("TESTS","skipped"),
              "preflight":os.environ.get("PREFLIGHT","skipped"),
              "evidence":os.environ.get("EVIDENCE","skipped"),
              "market":os.environ.get("MARKET","skipped"),
              "readiness":os.environ.get("READINESS","skipped"),
              "replay":os.environ.get("REPLAY","skipped"),
          }

          if stages["tests"]!="success":
              classification="CODE_FAIL"
          elif stages["preflight"]!="success":
              classification="DATA_SOURCE_FAIL"
          elif stages["evidence"]!="success" or stages["market"]!="success":
              classification="MATERIALIZATION_FAIL"
          elif stages["readiness"]!="success":
              classification="READINESS_FAIL"
          elif stages["replay"]!="success":
              classification="REPLAY_FAIL"
          else:
              classification="INFRA_PASS"

          payload={
              "classification":classification,
              "stages":stages,
          }
          print(json.dumps(payload,indent=2))
          Path("/tmp/pilot-status.json").write_text(
              json.dumps(payload,indent=2),
              encoding="utf-8",
          )

          if classification!="INFRA_PASS":
              raise SystemExit(2)
          PY
