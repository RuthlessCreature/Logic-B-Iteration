name: xgb-research-request

on:
  push:
    paths:
      - "research/run_requests/**"
  workflow_dispatch:
    inputs:
      request_file:
        description: "Path to research/run_requests/*.json"
        required: true
        type: string

jobs:
  xgb-research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATA_ROOT: /tmp/logic-b-xgb
      RUN_ROOT: /tmp/logic-b-runs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Resolve research request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FILE: ${{ inputs.request_file }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REQUEST_FILE="$DISPATCH_FILE"
          else
            REQUEST_FILE="$(
              git diff --name-only HEAD^ HEAD \
                | grep '^research/run_requests/.*\.json$' \
                | tail -n 1
            )"
          fi

          if [ -z "${REQUEST_FILE:-}" ] || [ ! -f "$REQUEST_FILE" ]; then
            echo "No valid research request file found"
            exit 2
          fi

          logic-b validate-request \
            --request "$REQUEST_FILE" \
            --config config/b0.yaml \
            --github-env "$GITHUB_ENV"

      - name: Restore accumulated XGB development cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: /tmp/logic-b-xgb
          key: xgb-development-v1-${{ github.run_id }}
          restore-keys: |
            xgb-development-v1-

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: pytest

      - name: Public endpoint preflight
        id: preflight
        continue-on-error: true
        run: |
          logic-b preflight-xgb --date "$PREFLIGHT_DATE"
          logic-b preflight-xgb-market --date "$PREFLIGHT_DATE"

      - name: Fetch evidence
        id: evidence
        if: steps.tests.outcome == 'success' && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          time logic-b fetch-xgb-evidence \
            --start "$RUN_START" \
            --end "$RUN_END" \
            --data-root "$DATA_ROOT" \
            --sleep 0.05 | tee /tmp/fetch-evidence.log

      - name: Fetch candidate market slices
        id: market
        if: steps.evidence.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          time logic-b fetch-xgb-market \
            --start "$RUN_START" \
            --end "$RUN_END" \
            --data-root "$DATA_ROOT" \
            --sleep 0.05 | tee /tmp/fetch-market.log

      - name: Candidate readiness
        id: readiness
        if: steps.market.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          logic-b xgb-readiness \
            --start "$RUN_START" \
            --end "$RUN_END" \
            --data-root "$DATA_ROOT" | tee /tmp/readiness.json

      - name: B0 replay
        id: replay
        if: steps.readiness.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          logic-b run-b0 \
            --start "$RUN_START" \
            --end "$RUN_END" \
            --data-root "$DATA_ROOT" \
            --run-root "$RUN_ROOT" \
            --fill "$FILL_MODEL" \
            --fetch-missing-minutes \
            --missing-minute-source xuangubao | tee /tmp/b0-run.json

      - name: Post-run attribution
        id: attribution
        if: steps.replay.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for run_dir in "$RUN_ROOT"/*; do
            if [ -d "$run_dir" ] && [ -f "$run_dir/metrics.json" ]; then
              logic-b analyze-run --run-dir "$run_dir"
            fi
          done

      - name: Emit research summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          root=Path(os.environ["RUN_ROOT"])
          summary=[
              f"# XGB research request: {os.environ.get('REQUEST_ID','unknown')}",
              "",
              f"- window: {os.environ.get('RUN_START')} .. {os.environ.get('RUN_END')}",
              f"- request: {os.environ.get('REQUEST_FILE')}",
              "",
          ]

          for path in sorted(root.glob("*/metrics.json")):
              data=json.loads(path.read_text(encoding="utf-8"))
              summary.append(f"## {path.parent.name}")
              for key in [
                  "total_return","cagr","max_drawdown","calmar",
                  "closed_trades","win_rate","expectancy",
                  "profit_factor","signals","ending_position",
              ]:
                  if key in data:
                      summary.append(f"- {key}: {data[key]}")
              summary.append("")

          text="\n".join(summary)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fh:
              fh.write(text+"\n")
          PY

      - name: Classify research result
        id: classification
        if: always()
        continue-on-error: true
        env:
          TESTS: ${{ steps.tests.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
          MARKET: ${{ steps.market.outcome }}
          READINESS: ${{ steps.readiness.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          stages={
              "tests":os.environ.get("TESTS","skipped"),
              "preflight":os.environ.get("PREFLIGHT","skipped"),
              "evidence":os.environ.get("EVIDENCE","skipped"),
              "market":os.environ.get("MARKET","skipped"),
              "readiness":os.environ.get("READINESS","skipped"),
              "replay":os.environ.get("REPLAY","skipped"),
          }

          if stages["tests"]!="success":
              classification="CODE_FAIL"
          elif stages["preflight"]!="success":
              classification="DATA_SOURCE_FAIL"
          elif stages["evidence"]!="success" or stages["market"]!="success":
              classification="MATERIALIZATION_FAIL"
          elif stages["readiness"]!="success":
              classification="READINESS_FAIL"
          elif stages["replay"]!="success":
              classification="REPLAY_FAIL"
          else:
              classification="INFRA_PASS"

          payload={
              "classification":classification,
              "request_id":os.environ.get("REQUEST_ID"),
              "start":os.environ.get("RUN_START"),
              "end":os.environ.get("RUN_END"),
              "stages":stages,
          }
          print(json.dumps(payload,indent=2))
          Path("/tmp/research-status.json").write_text(
              json.dumps(payload,indent=2),
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write(f"classification={classification}\n")
          PY

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REQUEST_ID }}-${{ env.RUN_START }}_${{ env.RUN_END }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/logic-b-runs/
            /tmp/readiness.json
            /tmp/b0-run.json
            /tmp/fetch-evidence.log
            /tmp/fetch-market.log
            /tmp/research-status.json

      - name: Enforce result
        if: always()
        env:
          CLASSIFICATION: ${{ steps.classification.outputs.classification }}
        run: |
          echo "classification=$CLASSIFICATION"
          test "$CLASSIFICATION" = "INFRA_PASS"
