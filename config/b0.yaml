version: "B0.0.3"

universe:
  market: "A-share"
  candidate_source: "previous_day_limit_up"
  include_boards:
    - main
    - chinext
    - star
  exclude_no_limit_ipo_days: true
  exclude_st: true

portfolio:
  max_positions: 1
  target_position_pct: 1.0
  initial_cash: 1000000
  t_plus_one: true

core_priority:
  - total_market_leader
  - sector_capacity_core
  - strongest_turnover_front
  - explicit_catchup_core

market_gate:
  blocked_regimes:
    - RETREAT
    - ICE

decision_checkpoints:
  - "09:25"
  - "09:35"
  - "10:00"
  - "10:30"
  - "14:30"

execution:
  decision_checkpoint: "09:35"
  exit_rule: "E0_NEXT_DAY_0935"
  primary_fill_model: "realistic"
  report_fill_models:
    - optimistic
    - realistic
    - conservative
  commission_rate: 0.0003
  minimum_commission: 5.0
  transfer_fee_rate: 0.00001
  stamp_rate: 0.0005
  forbid_same_day_sell: true
  forbid_same_bar_fill_after_signal: true
  model_limit_up_unfillable: true
  model_limit_down_lock: true

research:
  start_date: "2024-09-30"
  end_date: "2026-09-28"
  development_end: "2026-06-30"
  blind_holdout_start: "2026-07-01"
  blind_holdout_end: "2026-09-28"
  walk_forward: true
  walk_forward_min_train_days: 120
  walk_forward_validation_days: 40
  walk_forward_step_days: 40
  walk_forward_warmup_days: 2
  blind_holdout: true
  random_shuffle: false
  inspect_blind_holdout_during_iteration: false

promotion:
  # Frozen before the development baseline is inspected.
  require_positive_expectancy_conservative_fill: true
  min_conservative_expectancy: 0.0
  min_conservative_closed_trades: 30
  max_conservative_drawdown_abs: 0.25

  require_multi_fold_stability: true
  min_walk_forward_folds: 4
  min_positive_return_fold_rate: 0.60
  min_positive_expectancy_fold_rate: 0.60
  min_walk_forward_closed_trades: 20

  require_human_alignment: true
  min_human_labels: 80
  min_action_agreement: 0.80
  min_selection_agreement: 0.70
  min_core_type_agreement: 0.75

  require_parameter_neighborhood_stability: true
  min_tested_parameter_neighbors: 8

  complexity_penalty: true
  max_primary_rule_changes: 1
  max_new_free_parameters: 2
