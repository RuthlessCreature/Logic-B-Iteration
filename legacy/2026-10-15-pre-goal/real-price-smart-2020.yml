name: real-price-demand-driven-2020q1
on:
  push:
    branches: [research/behavioral-edge-20261013]
    paths:
      - .github/workflows/real-price-smart-2020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-quarter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install BaoStock and Logic-B
        run: python -m pip install -e ".[data,dev]"
      - name: Test deterministic smart pipeline
        run: python -m pytest -q tests/test_pipeline.py tests/test_integrity_guards.py
      - name: Run 2020 Q1 historical source pilot (max 50 exchange sessions)
        id: historical
        run: |
          python -m logic_b.pipeline --start 2020-01-01 --end 2020-03-31 \
            --max-sessions 50 --out runs/2020q1-demand-driven
      - name: Upload aggregate-only research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-b-2020q1-aggregate-only
          path: runs/2020q1-demand-driven/aggregate.json
          if-no-files-found: warn
          retention-days: 30
