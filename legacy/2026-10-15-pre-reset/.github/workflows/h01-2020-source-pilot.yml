name: h01-2020-source-pilot

on:
  push:
    paths:
      - ".github/workflows/h01-2020-source-pilot.yml"
  workflow_dispatch:

jobs:
  verify-2020-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify 2020 first trading week history
        run: |
          set -euo pipefail
          mkdir -p /tmp/h01-2020-report
          logic-b preflight-xgb --date 2020-01-02 | tee /tmp/h01-2020-report/preflight-20200102.json
      - name: Fetch first available 2020 sessions
        run: |
          set -euo pipefail
          logic-b fetch-xgb-evidence --start 2020-01-01 --end 2020-01-10 \
            --data-root /tmp/h01-2020-xgb --sleep 0.05
      - name: Historical consistency / activity check
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from logic_b.storage import LocalParquetStore
          from logic_b.h01_activity import limitup_continuation
          from logic_b.h01_data_audit import audit_xgb_limit_up_counts
          store=LocalParquetStore("/tmp/h01-2020-xgb")
          cal=store.read_all_parts("calendar")
          days=sorted(cal.cal_date.astype(str).unique())
          out=Path("/tmp/h01-2020-report")
          activity=limitup_continuation(store,days)
          activity.to_csv(out/"activity.csv",index=False)
          c, table=audit_xgb_limit_up_counts(store,days)
          table.to_csv(out/"vendor_counts.csv",index=False)
          report={
            "status":"2020_SAMPLE_AVAILABLE" if c["status"]=="COUNT_CONSISTENT" else "BLOCKED_COUNT_DISCREPANCY",
            "requested_start":"2020-01-01",
            "first_market_session":days[0] if days else None,
            "last_market_session":days[-1] if days else None,
            "trade_days":len(days),
            "pool_count_check":c,
            "not_backtest":True
          }
          (out/"summary.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if c["status"]!="COUNT_CONSISTENT": raise SystemExit(2)
          PY
      - name: Archive outcomes, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h01-2020-source-pilot
          path: /tmp/h01-2020-report
          retention-days: 30
          if-no-files-found: warn
